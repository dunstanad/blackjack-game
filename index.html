<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="cards-favicon.png">
    <script type="module" src="main.js"></script>
</head>
<body>
    <div id="bj-table">
        <h1 class="title">Blackjack</h1>
        <div class="game-box">
            <div class="hands">
                <h2 class="player-label">Player (<span class="total" id="player-total"></span>)</h2>
                <div class="hand" id="player-hand"></div>
            </div>
        
            <div class="hands">
                <h2 class="player-label">Dealer (<span class="total" id="dealer-total"></span>)</h2>
                <div class="hand" id="dealer-hand"></div>
            </div>
        </div>
        

        <div id="hit-stand">
            <span>What would you like to do?</span>
            <button id="hit-btn" >Hit</button>
            <button id="stand-btn" >Stand</button>
        </div>
        <div id="winner">
            <span id="winner-text"></span>
            <button id="play-again">Play Again</button>
        </div>
    </div>
</body>

</html>
